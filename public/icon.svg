<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0b1e" />
      <stop offset="50%" stop-color="#14061a" />
      <stop offset="100%" stop-color="#05020a" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#f43f5e" stroke-width="8"/>
  <circle cx="256" cy="256" r="190" fill="#f43f5e" opacity="0.1" />
  
  <!-- Beer Mug / Cards Symbol -->
  <g transform="translate(106, 106) scale(0.6)">
    <!-- Foam -->
    <path d="M120 100 C120 70, 160 60, 190 85 C220 55, 270 60, 290 90 C320 70, 360 85, 360 120 L120 120 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Mug Body -->
    <rect x="130" y="120" width="220" height="260" rx="36" fill="url(#flame)"/>
    <!-- Foam drippings -->
    <rect x="160" y="120" width="22" height="80" rx="11" fill="#ffffff"/>
    <rect x="230" y="120" width="26" height="110" rx="13" fill="#ffffff"/>
    <rect x="300" y="120" width="20" height="60" rx="10" fill="#ffffff"/>
    <!-- Handle -->
    <path d="M350 160 H400 C430 160, 430 300, 400 300 H350" fill="none" stroke="url(#flame)" stroke-width="40" stroke-linecap="round"/>
  </g>
  <!-- Card Suits -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">♥ ♦ ♣ ♠</text>
</svg>
